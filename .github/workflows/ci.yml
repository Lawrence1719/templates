name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: templates
          POSTGRES_PASSWORD: templates
          POSTGRES_DB: templates
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U templates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only used for the build step; tests use their own throwaway database.
      DATABASE_URL: postgres://templates:templates@localhost:5432/templates
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
